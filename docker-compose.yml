services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forever
      POSTGRES_PASSWORD: forever
      POSTGRES_DB: forever
    ports:
      - "5434:5432"
    volumes:
      - forever_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forever -d forever"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Optional local worker — requires HF_TOKEN and host networking to reach API.
  # Prefer: ./scripts/run-extract-worker.sh on the host (torch/pyannote).
  # extract-worker:
  #   build:
  #     context: ./Extract
  #   environment:
  #     FOREVER_API_URL: http://host.docker.internal:8001
  #     EXTRACT_WORKER_TOKEN: forever-extract-worker
  #     HF_TOKEN: ${HF_TOKEN:-}
  #   volumes:
  #     - ./apps/api/uploads:/uploads
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

volumes:
  forever_pgdata:
