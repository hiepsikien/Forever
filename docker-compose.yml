services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forever
      POSTGRES_PASSWORD: forever
      POSTGRES_DB: forever
    ports:
      - "5434:5432"
    volumes:
      - forever_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forever -d forever"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  forever_pgdata:
